<!-- more-genui: {"version":1,"id":"quadratic-2","title":"二次函数的a,b,c与抛物线","stateVersion":1} -->
<html><body style="margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;">
<div style="max-width:560px;margin:0 auto;">
<h2 style="color:var(--accent);font-weight:500;">📐 二次函数 y = ax²+bx+c</h2>
<p style="font-size:13px;opacity:0.75;">a控制开口方向/宽窄，b影响对称轴位置，c是y轴截距。顶点 x = −b/(2a)。</p>
<canvas id="c" width="520" height="240" style="width:100%;background:#0e1c2c;border-radius:12px;"></canvas>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px;">
<div><label style="font-size:12px;">a <output id="av">1.0</output></label><input id="a" type="range" min="-3" max="3" step="0.1" value="1" style="width:100%;"></div>
<div><label style="font-size:12px;">b <output id="bv">0.0</output></label><input id="b" type="range" min="-5" max="5" step="0.1" value="0" style="width:100%;"></div>
<div><label style="font-size:12px;">c <output id="cv">0.0</output></label><input id="c" type="range" min="-5" max="5" step="0.1" value="0" style="width:100%;"></div>
</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),sa=document.getElementById('a'),sb=document.getElementById('b'),sc=document.getElementById('c');
const st=genui.getState();if(st.a!=null)sa.value=st.a;if(st.b!=null)sb.value=st.b;if(st.c!=null)sc.value=st.c;
function draw(){const w=c.width,h=c.height,A=+sa.value,B=+sb.value,C=+sc.value;
document.getElementById('av').textContent=A.toFixed(1);document.getElementById('bv').textContent=B.toFixed(1);document.getElementById('cv').textContent=C.toFixed(1);
ctx.clearRect(0,0,w,h);ctx.strokeStyle='#3f5f7a';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();
const sx=w/10,sy=h/10;ctx.beginPath();ctx.strokeStyle='var(--accent)';ctx.lineWidth=2.5;
for(let i=0;i<=w;i++){const x=(i-w/2)/sx,y=A*x*x+B*x+C;const py=h/2-y*sy;i?ctx.lineTo(i,py):ctx.moveTo(i,py);}
ctx.stroke();genui.setState({a:A,b:B,c:C});}
sa.oninput=draw;sb.oninput=draw;sc.oninput=draw;draw();
</script></body></html>
