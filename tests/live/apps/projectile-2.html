<!-- more-genui: {"version":1,"id":"projectile-2","title":"抛体运动·初速度与角度","stateVersion":1} -->
<html><body style="margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;">
<div style="max-width:560px;margin:0 auto;">
<h2 style="color:var(--accent);font-weight:500;">🚀 无阻力抛体运动 (g=9.8)</h2>
<p style="font-size:13px;opacity:0.75;">x=v₀cosθ·t，y=v₀sinθ·t−½gt²。轨迹为抛物线，落回地面时 y=0。</p>
<canvas id="c" width="520" height="240" style="width:100%;background:#0e1c2c;border-radius:12px;"></canvas>
<div style="margin-top:12px;"><label style="display:flex;justify-content:space-between;">初速度 v₀ (m/s) <output id="vv">20.0</output></label>
<input id="v" type="range" min="5" max="50" step="0.5" value="20" style="width:100%;"></div>
<div style="margin-top:12px;"><label style="display:flex;justify-content:space-between;">角度 θ (°) <output id="tv">45</output></label>
<input id="t" type="range" min="5" max="85" step="1" value="45" style="width:100%;"></div>
<p id="info" style="font-size:13px;margin-top:10px;color:var(--accent);"></p>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),v=document.getElementById('v'),t=document.getElementById('t');
const st=genui.getState();if(st.v!=null)v.value=st.v;if(st.theta!=null)t.value=st.theta;
function draw(){const w=c.width,h=c.height,V=+v.value,th=+t.value*Math.PI/180;
document.getElementById('vv').textContent=V.toFixed(1);document.getElementById('tv').textContent=(+t.value).toFixed(0);
const vx=V*Math.cos(th),vy=V*Math.sin(th),g=9.8;
const tFlight=2*vy/g,range=vx*tFlight,maxH=vy*vy/(2*g);
ctx.clearRect(0,0,w,h);ctx.strokeStyle='#3f5f7a';ctx.beginPath();ctx.moveTo(0,h-20);ctx.lineTo(w,h-20);ctx.stroke();
const scaleX=(w-40)/Math.max(range,1),scaleY=(h-50)/Math.max(maxH*2,1);
ctx.beginPath();ctx.strokeStyle='var(--accent)';ctx.lineWidth=2.5;
for(let i=0;i<=200;i++){const tt=i/200*tFlight;const x=vx*tt,y=vy*tt-0.5*g*tt*tt;const px=20+x*scaleX,py=h-20-y*scaleY;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
ctx.stroke();
ctx.beginPath();ctx.arc(20+range*scaleX,h-20,6,0,2*Math.PI);ctx.fillStyle='#ffd966';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
document.getElementById('info').textContent=`射程 ${range.toFixed(1)}m · 最大高度 ${maxH.toFixed(1)}m · 飞行时间 ${tFlight.toFixed(2)}s`;
genui.setState({v:V,theta:+t.value});}
v.oninput=draw;t.oninput=draw;draw();
</script></body></html>
