<html><body style="margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;">
<div style="max-width:560px;margin:0 auto;">
<h2 style="color:var(--accent);font-weight:500;">🎨 RGB 三原色混合</h2>
<p style="font-size:13px;opacity:0.75;">加色混合：R、G、B 亮度叠加形成颜色。rgb(r,g,b) 各通道 0–255。</p>
<div id="swatch" style="width:100%;height:180px;border-radius:12px;margin-top:8px;border:1px solid #3f5f7a;transition:0.15s;"></div>
<div style="margin-top:12px;"><label style="display:flex;justify-content:space-between;">R <output id="rv">128</output></label><input id="r" type="range" min="0" max="255" value="128" style="width:100%;accent-color:#ff5252;"></div>
<div style="margin-top:8px;"><label style="display:flex;justify-content:space-between;">G <output id="gv">128</output></label><input id="g" type="range" min="0" max="255" value="128" style="width:100%;accent-color:#52ff7a;"></div>
<div style="margin-top:8px;"><label style="display:flex;justify-content:space-between;">B <output id="bv">128</output></label><input id="b" type="range" min="0" max="255" value="128" style="width:100%;accent-color:#52a8ff;"></div>
<p id="info" style="font-size:13px;margin-top:10px;color:var(--accent);"></p>
</div>
<script>
const sw=document.getElementById('swatch'),r=document.getElementById('r'),g=document.getElementById('g'),b=document.getElementById('b');
const st=genui.getState();if(st.r!=null)r.value=st.r;if(st.g!=null)g.value=st.g;if(st.b!=null)b.value=st.b;
function draw(){const R=+r.value,G=+g.value,B=+b.value;
document.getElementById('rv').textContent=R;document.getElementById('gv').textContent=G;document.getElementById('bv').textContent=B;
sw.style.background=`rgb(${R},${G},${B})`;
document.getElementById('info').textContent=`rgb(${R}, ${G}, ${B}) · #${((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1).toUpperCase()}`;
genui.setState({r:R,g:G,b:B});}
r.oninput=draw;g.oninput=draw;b.oninput=draw;draw();
</script></body></html>
