<!-- more-genui: {"version":1,"id":"wave-2","title":"正弦波振幅与频率","stateVersion":1} -->
<html><body style="margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;">
<div style="max-width:560px;margin:0 auto;">
<h2 style="color:var(--accent);font-weight:500;">🌊 正弦波 · 振幅与频率</h2>
<p style="font-size:13px;opacity:0.75;">y(t) = A·sin(2πf·t)，t∈[0,2]s。振幅A拉伸波峰，频率f压缩周期。</p>
<canvas id="c" width="520" height="220" style="width:100%;background:#0e1c2c;border-radius:12px;"></canvas>
<div style="margin-top:12px;"><label style="display:flex;justify-content:space-between;">振幅 A <output id="av">1.00</output></label>
<input id="a" type="range" min="0.2" max="2" step="0.01" value="1" style="width:100%;"></div>
<div style="margin-top:12px;"><label style="display:flex;justify-content:space-between;">频率 f (Hz) <output id="fv">1.00</output></label>
<input id="f" type="range" min="0.5" max="4" step="0.01" value="1" style="width:100%;"></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),a=document.getElementById('a'),f=document.getElementById('f');
const st=genui.getState();if(st.amp!=null)a.value=st.amp;if(st.freq!=null)f.value=st.freq;
function draw(){const w=c.width,h=c.height,A=+a.value,F=+f.value;document.getElementById('av').textContent=A.toFixed(2);document.getElementById('fv').textContent=F.toFixed(2);
ctx.clearRect(0,0,w,h);ctx.strokeStyle='#3f5f7a';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
ctx.beginPath();ctx.strokeStyle='var(--accent)';ctx.lineWidth=2.5;
for(let i=0;i<=600;i++){const t=i/600*2,x=i/600*w,y=A*Math.sin(2*Math.PI*F*t);const py=h/2-(y/2.2)*(h/2)*0.9;i?ctx.lineTo(x,py):ctx.moveTo(x,py);}
ctx.stroke();genui.setState({amp:A,freq:F});}
a.oninput=draw;f.oninput=draw;draw();
</script></body></html>
