<!-- more-genui: {"version":1,"id":"sort-2","title":"冒泡排序逐步演示","stateVersion":1} -->
<html><body style="margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;">
<div style="max-width:560px;margin:0 auto;">
<h2 style="color:var(--accent);font-weight:500;">🔁 冒泡排序逐步演示</h2>
<p style="font-size:13px;opacity:0.75;">重复扫描相邻元素，逆序则交换。每轮把最大元素"冒泡"到末尾。</p>
<div id="bars" style="display:flex;align-items:flex-end;gap:6px;height:180px;background:#0e1c2c;padding:12px;border-radius:12px;"></div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
<button id="step" style="padding:8px 16px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer;">单步 ▶</button>
<button id="reset" style="padding:8px 16px;background:#3f5f7a;color:var(--fg);border:none;border-radius:8px;cursor:pointer;">重置 ⟲</button>
</div>
<p id="status" style="font-size:13px;margin-top:8px;color:var(--accent);">已排序: 0 / 6</p>
</div>
<script>
const orig=[5,2,8,1,9,3];
let arr=[...orig],i=0,j=0,done=0,sorted=false;
const st=genui.getState();if(st.arr&&Array.isArray(st.arr)){arr=st.arr;i=st.i||0;j=st.j||0;done=st.done||0;sorted=st.sorted||false;}
function render(){const b=document.getElementById('bars');b.innerHTML='';
const max=Math.max(...arr);arr.forEach((v,idx)=>{const d=document.createElement('div');
d.style.cssText=`flex:1;height:${(v/max)*100}%;background:${idx>=arr.length-done?'#6bc9ff':(idx===j?'#ffd966':'#3f5f7a')};border-radius:6px 6px 0 0;transition:0.2s;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:11px;padding-top:4px;`;
d.textContent=v;b.appendChild(d);});
document.getElementById('status').textContent=sorted?'✅ 排序完成！':`已排序: ${done} / 6 · 比较位置 j=${j}`;}
function step(){if(sorted)return;if(j>=arr.length-1-done){done++;j=0;if(done>=arr.length-1){sorted=true;genui.setState({arr,i,j,done,sorted});render();return;}}
if(arr[j]>arr[j+1])[arr[j],arr[j+1]]=[arr[j+1],arr[j]];j++;genui.setState({arr,i,j,done,sorted});render();}
document.getElementById('step').onclick=step;
document.getElementById('reset').onclick=()=>{arr=[...orig];i=0;j=0;done=0;sorted=false;genui.setState({arr,i,j,done,sorted});render();};
render();
</script></body></html>
