<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB混合</title>
<style>
:root{--bg:#0f1420;--fg:#e8edf7;--accent:#7ee081}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
.w{max-width:720px;margin:auto}h1{font-size:1.1rem;margin:0 0 6px}
p.s{font-size:.8rem;color:#9aa7c2;margin:0 0 12px;line-height:1.5}
#out{height:120px;border-radius:10px;border:1px solid #2a3550;margin-bottom:10px;transition:background .15s}
.c{margin-top:8px}.r{display:flex;justify-content:space-between;font-size:.78rem;color:#9aa7c2;margin-bottom:3px}
input[type=range]{width:100%;accent-color:var(--accent)}
.f{margin-top:8px;font-size:.85rem;font-family:ui-monospace,monospace}
</style></head><body><div class="w">
<h1>RGB 三原色加色混合</h1>
<p class="s">红、绿、蓝通道值线性叠加，叠加处混合出黄、青、品红与白色。</p>
<div id="out"></div>
<div class="c"><div class="r"><span>红 R</span><span id="orr">128</span></div><input id="r" type="range" min="0" max="255" step="1" value="128" aria-label="红通道"></div>
<div class="c"><div class="r"><span>绿 G</span><span id="og">128</span></div><input id="g" type="range" min="0" max="255" step="1" value="128" aria-label="绿通道"></div>
<div class="c"><div class="r"><span>蓝 B</span><span id="ob">128</span></div><input id="b" type="range" min="0" max="255" step="1" value="128" aria-label="蓝通道"></div>
<p class="f" id="info"></p>
</div>
<script>(function(){
var D={r:128,g:128,b:128},S=Object.assign({},D);
try{if(genui&&genui.getState){var g=genui.getState();if(g&&typeof g==="object"){["r","g","b"].forEach(function(k){if(isFinite(+g[k]))S[k]=Math.min(255,Math.max(0,Math.round(+g[k])))});}}}catch(e){}
var out=document.getElementById("out"),info=document.getElementById("info");
var o={r:document.getElementById("orr"),g:document.getElementById("og"),b:document.getElementById("ob")};
function save(){try{genui.setState(S)}catch(e){}}
function hex(v){return("0"+v.toString(16)).slice(-2).toUpperCase()}
function ui(){
 out.style.background="rgb("+S.r+","+S.g+","+S.b+")";
 o.r.textContent=S.r;o.g.textContent=S.g;o.b.textContent=S.b;
 document.getElementById("r").value=S.r;document.getElementById("g").value=S.g;document.getElementById("b").value=S.b;
 info.textContent="#"+hex(S.r)+hex(S.g)+hex(S.b)+"  rgb("+S.r+", "+S.g+", "+S.b+")";
}
["r","g","b"].forEach(function(k){document.getElementById(k).oninput=function(){S[k]=+this.value;ui();save()}});
ui();
})();</script></body></html>
