<!-- more-genui: {"version":1,"id":"sine-wave","title":"正弦波实验室","stateVersion":1} -->
<html><head><style>body{max-width:900px;margin:24px auto;padding:0 18px}h1{font-size:24px}label{display:flex;gap:12px;align-items:center;margin:14px 0}input{flex:1}svg{width:100%;height:240px;background:color-mix(in srgb,var(--accent) 5%,var(--bg));border-radius:12px}button{padding:8px 14px;margin:6px;border-radius:8px;border:1px solid #8886;background:var(--bg);color:var(--fg)}output{font-variant-numeric:tabular-nums}</style></head><body><h1>正弦波实验室</h1><p>y = A sin(2πft)。观察振幅和频率如何改变波形。</p><label>振幅 <input id="amplitude" aria-label="振幅" type="range" min="0" max="2" step="0.1"><output id="a"></output></label><label>频率 <input id="frequency" aria-label="频率" type="range" min="0.5" max="5" step="0.5"><output id="f"></output></label><svg viewBox="0 0 800 240" role="img" aria-label="正弦波形"><path id="curve" fill="none" stroke="var(--accent)" stroke-width="3"/></svg><script>const s={amplitude:1,frequency:1,...genui.getState()};const amp=document.getElementById('amplitude'),freq=document.getElementById('frequency');amp.value=s.amplitude;freq.value=s.frequency;function draw(){s.amplitude=+amp.value;s.frequency=+freq.value;document.getElementById('a').textContent=s.amplitude;document.getElementById('f').textContent=s.frequency;document.getElementById('curve').setAttribute('d',Array.from({length:801},(_,x)=>(x?'L':'M')+x+','+(120-50*s.amplitude*Math.sin(x/800*2*Math.PI*s.frequency))).join(' '));genui.setState(s)}amp.addEventListener('input',draw);freq.addEventListener('input',draw);draw();</script></body></html>
