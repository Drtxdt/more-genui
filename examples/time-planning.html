<html><body><div class="stack"><p class="muted">从 08:00 开始，连续安排 3 个学习块，每块后休息 10 分钟（末块除外）。不跨日。</p><label>每块学习分钟<input id="value" type="number" min="1" max="300" value="25"></label><output id="result" aria-live="polite"></output></div><script>const input=document.getElementById('value'),result=document.getElementById('result');input.value=genui.getState().value??input.value;function update(){const v=Number(input.value);if(!Number.isInteger(v)||v<1||v>300){result.textContent='请输入 1–300 的整数';return}const end=480+v*3+20;result.textContent='结束时间 '+String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0')+'；学习 '+v*3+' 分钟';genui.setState({value:input.value})};input.oninput=update;update();</script></body></html>
