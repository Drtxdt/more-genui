<html><body><div class="stack"><p class="muted">墙面 30 m²，门窗 6 m²，刷 2 遍。忽略损耗，整升向上取整。</p><label>每升每遍覆盖面积（m²/L）<input id="value" type="number" min="0.1" step="0.1" value="10"></label><output id="result" aria-live="polite"></output></div><script>const input=document.getElementById('value'),result=document.getElementById('result');input.value=genui.getState().value??input.value;function update(){const v=Number(input.value);result.textContent=Number.isFinite(v)&&v>0?'理论用量 '+(48/v).toFixed(2)+' L；需购买 '+Math.ceil(48/v)+' L':'覆盖面积必须大于 0';if(v>0)genui.setState({value:input.value})};input.oninput=update;update();</script></body></html>
