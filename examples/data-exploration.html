<html><body><div class="stack"><p class="muted">样本值：10、20、30、40；筛选后重新计算。</p><label>最低值<input id="value" type="number" value="0"></label><output id="result" aria-live="polite"></output><svg id="plot" viewBox="0 0 400 100" role="img" aria-label="筛选后的数值"></svg></div><script>const input=document.getElementById('value'),result=document.getElementById('result');input.value=genui.getState().value??input.value;function update(){const v=Number(input.value),a=[10,20,30,40].filter(x=>x>=v);result.textContent=a.length?'数量 '+a.length+'，均值 '+a.reduce((s,x)=>s+x,0)/a.length:'没有符合条件的数据';document.getElementById('plot').innerHTML=a.map((x,i)=>'<rect x="'+i*95+'" y="'+(100-x*2)+'" width="60" height="'+x*2+'" fill="var(--chart-1)"/>').join('');genui.setState({value:input.value})};input.oninput=update;update();</script></body></html>
