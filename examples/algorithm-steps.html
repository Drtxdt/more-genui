<html><body><div class="stack"><p class="muted">有序数组：[1, 3, 5, 7, 9]。修改目标后从第一步开始。</p><label>查找目标<input id="value" type="number" value="7"></label><button id="next">下一步</button><output id="result" aria-live="polite"></output></div><script>const input=document.getElementById('value'),result=document.getElementById('result');input.value=genui.getState().value??input.value;const a=[1,3,5,7,9];let lo=0,hi=4,done=false;function draw(){result.textContent=done?result.textContent:'候选下标 ['+lo+', '+hi+']';genui.setState({value:input.value})}function update(){lo=0;hi=4;done=false;document.getElementById('next').disabled=false;draw()}document.getElementById('next').onclick=()=>{if(done)return;const mid=Math.floor((lo+hi)/2),v=Number(input.value);if(a[mid]===v){result.textContent='找到：下标 '+mid;done=true}else{if(a[mid]<v)lo=mid+1;else hi=mid-1;if(lo>hi){result.textContent='未找到';done=true}}document.getElementById('next').disabled=done;draw()};input.oninput=update;update();</script></body></html>
