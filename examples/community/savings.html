<!-- more-genui: {"version":1,"id":"savings","title":"月末储蓄","stateVersion":1} -->
<html lang="zh">
  <body>
    <main class="stack">
      <p>月末存入，按月复利。未计入税费与通胀。</p>
      <label
        >每月投入
        <input id="deposit" type="number" min="0" max="100000" step="0.01" value="500" required
      /></label>
      <label
        >年数 <input id="years" type="number" min="1" max="80" step="1" value="30" required
      /></label>
      <label
        >假设年收益率 %
        <input id="rate" type="number" min="0" max="20" step="0.1" value="5" required /></label
      ><output aria-live="polite"></output>
    </main>
    <script>
      function setup(compute) {
        const inputs = [...document.querySelectorAll('input')],
          out = document.querySelector('output');
        const state = genui.getState();
        function update() {
          if (!inputs.every((input) => input.checkValidity())) {
            out.textContent = '请检查输入范围';
            return;
          }
          const values = Object.fromEntries(inputs.map((input) => [input.id, input.valueAsNumber]));
          genui.setState(values);
          out.textContent = compute(values);
        }
        for (const input of inputs) {
          if (Number.isFinite(state[input.id])) input.value = state[input.id];
          input.oninput = update;
        }
        update();
      }
      setup(({ deposit, years, rate }) => {
        const n = years * 12,
          r = rate / 1200,
          principal = deposit * n;
        const balance = r === 0 ? principal : (deposit * Math.expm1(n * Math.log1p(r))) / r;
        return (
          '本金 ' +
          principal.toFixed(2) +
          '，增长 ' +
          (balance - principal).toFixed(2) +
          '，总额 ' +
          balance.toFixed(2)
        );
      });
    </script>
  </body>
</html>
