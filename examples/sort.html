<!-- more-genui: {"version":1,"id":"bubble-sort","title":"冒泡排序逐步演示","stateVersion":1} -->
<html><head><style>body{max-width:900px;margin:24px auto;padding:0 18px}h1{font-size:24px}label{display:flex;gap:12px;align-items:center;margin:14px 0}input{flex:1}svg{width:100%;height:240px;background:color-mix(in srgb,var(--accent) 5%,var(--bg));border-radius:12px}button{padding:8px 14px;margin:6px;border-radius:8px;border:1px solid #8886;background:var(--bg);color:var(--fg)}output{font-variant-numeric:tabular-nums}</style></head><body><h1>冒泡排序逐步演示</h1><p>每步比较相邻两个数；逆序则交换。橙色表示当前比较位置。</p><svg viewBox="0 0 800 240" id="bars" role="img" aria-label="排序数组"></svg><button id="next">下一步</button><button id="restart">重新开始</button><output id="status"></output><script>const initial=[7,3,8,2,6,1,5,4];let s={values:[...initial],i:0,j:0,steps:0,...genui.getState()};function draw(){const svg=document.getElementById('bars');svg.replaceChildren();s.values.forEach((v,index)=>{const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',index*95+20);rect.setAttribute('y',230-v*25);rect.setAttribute('width',65);rect.setAttribute('height',v*25);rect.setAttribute('fill',index===s.j?'#d97706':'var(--accent)');svg.append(rect)});document.getElementById('status').textContent=s.i>=7?'排序完成：'+s.values.join(', '):'比较次数：'+s.steps;document.getElementById('next').disabled=s.i>=7;genui.setState(s)}document.getElementById('next').onclick=()=>{if(s.values[s.j]>s.values[s.j+1])[s.values[s.j],s.values[s.j+1]]=[s.values[s.j+1],s.values[s.j]];s.steps++;s.j++;if(s.j>=7-s.i){s.i++;s.j=0}draw()};document.getElementById('restart').onclick=()=>{s={values:[...initial],i:0,j:0,steps:0};draw()};draw();</script></body></html>
