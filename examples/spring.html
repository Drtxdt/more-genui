<!-- more-genui: {"version":1,"id":"spring","title":"弹簧振子","stateVersion":1} -->
<html><head><style>body{max-width:900px;margin:24px auto;padding:0 18px}h1{font-size:24px}label{display:flex;gap:12px;align-items:center;margin:14px 0}input{flex:1}svg{width:100%;height:240px;background:color-mix(in srgb,var(--accent) 5%,var(--bg));border-radius:12px}button{padding:8px 14px;margin:6px;border-radius:8px;border:1px solid #8886;background:var(--bg);color:var(--fg)}output{font-variant-numeric:tabular-nums}</style></head><body><h1>弹簧振子</h1><p>理想无阻尼系统，质量 m = 1 kg，初始位移 1 m，初速度 0。ω = √(k/m)。</p><label>刚度 k <input aria-label="刚度" id="stiffness" type="range" min="1" max="25" step="1"><output id="k"></output></label><label>时间 t <input aria-label="时间" id="time" type="range" min="0" max="10" step="0.05"><output id="t"></output></label><svg viewBox="0 0 800 240"><line x1="80" y1="120" x2="400" y2="120" stroke="var(--accent)" stroke-width="5" id="spring"/><circle id="mass" cx="400" cy="120" r="28" fill="var(--accent)"/></svg><output id="value"></output><script>const s={stiffness:4,time:0,...genui.getState()};const k=document.getElementById('stiffness'),t=document.getElementById('time');k.value=s.stiffness;t.value=s.time;function draw(){s.stiffness=+k.value;s.time=+t.value;const x=Math.cos(Math.sqrt(s.stiffness)*s.time),cx=450+200*x;document.getElementById('mass').setAttribute('cx',cx);document.getElementById('spring').setAttribute('x2',cx);document.getElementById('k').textContent=s.stiffness;document.getElementById('t').textContent=s.time;document.getElementById('value').textContent='位移 x = '+x.toFixed(3)+' m';genui.setState(s)}k.oninput=t.oninput=draw;draw();</script></body></html>
