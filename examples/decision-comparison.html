<html><body><div class="stack"><p class="muted">公交：省钱 90 / 省时 40；地铁：省钱 60 / 省时 80。分值为演示假设。</p><label>省钱权重（%，其余为省时）<input id="value" type="range" min="0" max="100" value="50"></label><output id="result" aria-live="polite"></output></div><script>const input=document.getElementById('value'),result=document.getElementById('result');input.value=genui.getState().value??input.value;function update(){const w=Math.max(0,Math.min(100,Number(input.value)))/100,a=90*w+40*(1-w),b=60*w+80*(1-w);result.textContent='公交 '+a.toFixed(1)+' / 地铁 '+b.toFixed(1)+'；'+(Math.abs(a-b)<1e-9?'并列':a>b?'公交领先':'地铁领先');genui.setState({value:input.value})};input.oninput=update;update();</script></body></html>
