<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'"></head><body><script>function createStepperAPI(read,save,report){
  return Object.freeze({mount(container,{id,steps}){
    try{
      if(!(container instanceof HTMLElement)||!id||!Array.isArray(steps)||!steps.length||steps.some(s=>typeof s?.title!=='string'||typeof s.text!=='string'))throw Error('分步演示需要 id 和含 title、text 的步骤');
      const key=JSON.stringify(steps);
      let hash=2166136261;for(const c of key)hash=Math.imul(hash^c.charCodeAt(0),16777619);
      const old=read(id);
      let index=old?.hash===hash && Number.isInteger(old.index)?Math.max(0,Math.min(old.index,steps.length-1)):0,timer;
      const text=document.createElement('p'),title=document.createElement('strong'),tools=document.createElement('div');
      text.setAttribute('role','status');tools.className='row';container.replaceChildren(title,text,tools);
      function button(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;tools.append(b);return b;}
      function stop(){clearInterval(timer);timer=null;play.textContent='播放';}
      function draw(){title.textContent=(index+1)+'/'+steps.length+' · '+steps[index].title;text.textContent=steps[index].text;prev.disabled=index===0;next.disabled=index===steps.length-1;play.disabled=next.disabled;if(next.disabled)stop();save(id,{index,hash});}
      const prev=button('上一步',()=>{stop();index--;draw();}),next=button('下一步',()=>{stop();index++;draw();});
      const play=button('播放',()=>{if(timer){stop();return;}play.textContent='暂停';timer=setInterval(()=>{if(document.hidden||!container.contains(play)){stop();return;}index++;draw();},2000/Number(speed.value));});
      const speed=document.createElement('select');speed.setAttribute('aria-label','速度');for(const n of [0.5,1,2])speed.add(new Option(n+'×',String(n)));speed.value='1';speed.onchange=()=>{if(timer){stop();play.click();}};tools.append(speed);
      button('重置',()=>{stop();index=0;draw();});draw();
    }catch(e){report(e.message);}
  }});
}

function createExperimentAPI(send) {
  let graphic;
  function publish(config={}) {
    const {figure,...values}=config;
    graphic=figure instanceof HTMLCanvasElement || figure instanceof SVGSVGElement ? figure : null;
    const json=JSON.stringify(values);
    if(new TextEncoder().encode(json).length>65536)throw Error('实验数据超过 64 KiB');
    send('experiment',{...JSON.parse(json),hasFigure:!!graphic});
  }
  async function png(){
    if(!graphic)throw Error('尚未登记图形');
    let canvas=graphic;
    if(graphic instanceof SVGSVGElement){
      canvas=document.createElement('canvas');
      const rect=graphic.getBoundingClientRect();
      canvas.width=Math.max(1,Math.min(4096,Math.ceil(rect.width)));
      canvas.height=Math.max(1,Math.min(4096,Math.ceil(rect.height)));
      const img=new Image();
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(graphic));
      await img.decode();canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    }
    if(canvas.width*canvas.height>16777216)throw Error('图形尺寸超过导出上限');
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob||blob.size>8*1024*1024)throw Error('PNG 超过导出上限');
    return blob;
  }
  return {api:Object.freeze({publish}),png};
}

function createQuizAPI(read, save, report) {
  const mounted = new Map();
  const validId = (value) => typeof value === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(value);
  const hasText = (value) => typeof value === 'string' && value.trim().length > 0;
  function validate(config) {
    if (!validId(config?.id)) throw Error('练习需要稳定的 id（字母、数字、下划线或短横线）');
    if (!Array.isArray(config.questions) || !config.questions.length) throw Error('练习缺少题目');
    const ids = new Set();
    return config.questions.map((q, index) => {
      const invalid = (reason) => {
        throw Error('第 ' + (index + 1) + ' 题（' + String(q?.id ?? '无 ID') + '）：' + reason);
      };
      if (!validId(q?.id) || ids.has(q.id)) invalid('题目 ID 缺失、无效或重复');
      ids.add(q.id);
      if (!hasText(q.prompt) || !hasText(q.explanation)) invalid('需要题干和解析');
      const type=q.type??'single';
      if(!['single','multiple','number','order'].includes(type))invalid('未知题型');
      if(type==='number'){
        if(!Number.isFinite(q.correct)||!Number.isFinite(q.tolerance??0)||(q.tolerance??0)<0||!hasText(q.hint))invalid('数值题需要有限正确值、非负容差和提示');
        return {id:q.id,prompt:q.prompt,explanation:q.explanation,type,correct:q.correct,tolerance:q.tolerance??0,unit:String(q.unit??''),hint:q.hint};
      }
      if (!Array.isArray(q.options) || q.options.length < 2) invalid('至少需要两个选项');
      if(type!=='single'){
        if(!Array.isArray(q.correct)||!q.correct.length||new Set(q.correct).size!==q.correct.length||!q.correct.every(id=>q.options.some(o=>o?.id===id))||(type==='order'&&q.correct.length!==q.options.length)||!hasText(q.hint))invalid('需要有效的正确选项列表和提示');
      } else if (!q.options.some((o) => o?.id === q.correct)) invalid('正确答案必须指向一个选项 ID');
      const choices = new Set();
      const options = q.options.map((o) => {
        if (!validId(o?.id) || choices.has(o.id)) invalid('选项 ID 缺失、无效或重复');
        choices.add(o.id);
        if (!hasText(o.text)) invalid('选项缺少文字');
        if (type==='single' && o.id !== q.correct && !hasText(o.hint)) invalid('错误选项 ' + o.id + ' 缺少提示');
        return { id: o.id, text: o.text, hint: o.hint ?? '' };
      });

      return {
        ...(type==='single'?{}:{type,hint:q.hint}),
        id: q.id,
        prompt: q.prompt,
        options,
        correct: q.correct,
        explanation: q.explanation,
      };
    });
  }
  const element = (tag, text) => {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
  };
  function mount(container, config) {
    try {
      if (!(container instanceof HTMLElement)) throw Error('挂载目标必须为 HTML 元素');
      const questions = validate(config);
      const previous = mounted.get(config.id);
      if (previous?.isConnected && previous !== container)
        throw Error('页面中有重复的练习 ID ' + config.id);
      mounted.set(config.id, container);
      // A compact content fingerprint leaves the state quota available for user data.
      let hash = 14695981039346656037n;
      for (const char of JSON.stringify(questions))
        hash = BigInt.asUintN(64, (hash ^ BigInt(char.codePointAt(0))) * 1099511628211n);
      const signature = hash.toString(16);
      let progress = { signature, index: 0, choice: null, phase: 'choose' };
      const stored = read(config.id);
      if (
        stored?.signature === signature &&
        Number.isInteger(stored.index) &&
        questions[stored.index] &&
        ['choose', 'hint', 'answer'].includes(stored.phase) &&
        (stored.choice==null||['string','number'].includes(typeof stored.choice)||Array.isArray(stored.choice))
      ) progress={...stored};
      const first=progress.first??Object.create(null);
      if(stored?.signature===signature && !stored.first){
        for(let i=0;i<progress.index+(progress.phase==='choose'?0:1);i++)first[questions[i].id]=null;
      }
      function update(change) {
        progress = { ...progress, ...change };
        progress.first=first;
        save(config.id, progress);
      }
      function draw(focus = false) {
        const q = questions[progress.index],
          sequence=progress.review??questions.map((_,i)=>i),
          position=sequence.indexOf(progress.index),
          last=position===sequence.length-1;
        const group = element('fieldset'),
          title = element(
            'legend',
            (questions.length > 1
              ? '第 ' + (progress.index + 1) + '/' + questions.length + ' 题 · '
              : '') + q.prompt,
          );
        group.style.cssText = 'border:0;margin:0;padding:0;min-width:0';
        title.style.cssText = 'font-weight:600;padding:0;margin-bottom:.5em';
        title.tabIndex = -1;
        group.append(title);
        const feedback = element('p');
        feedback.setAttribute('role', 'status');
        const actions = element('div');
        actions.className = 'row';
        function button(text, action) {
          const b = element('button', text);
          b.type = 'button';
          b.onclick = action;
          actions.append(b);
          return b;
        }
        let submit, choice=progress.choice;
        const editable=progress.phase==='choose';
        const options=q.options??[];
        const values=()=>Array.isArray(choice)?choice:[];
        const valid=()=>q.type==='number'?choice!==null && String(choice).trim()!=='' && Number.isFinite(Number(choice)):q.type==='multiple'?values().length>0:choice!==null;
        const set=value=>{choice=value;update({choice:value});if(submit)submit.disabled=!valid();};
        const correct=()=>{
          if(q.type==='number')return Math.abs(Number(choice)-q.correct)<=q.tolerance+Number.EPSILON*Math.abs(q.correct);
          if(q.type==='order')return values().every((v,i)=>v===q.correct[i]) && values().length===q.correct.length;
          if(q.type==='multiple')return values().length===q.correct.length && q.correct.every(v=>values().includes(v));
          return choice===q.correct;
        };
        if(q.type==='number'){
          const label=element('label','答案'+(q.unit?'（'+q.unit+'）':'')+'，容差 ±'+q.tolerance+' ');
          const input=element('input');input.type='number';input.step='any';input.value=choice??'';input.disabled=!editable;
          input.oninput=()=>set(input.value);label.append(input);group.append(label);
        }else if(q.type==='order'){
          if(!Array.isArray(choice))choice=options.map(o=>o.id);
          choice.forEach((id,i)=>{
            const row=element('div',options.find(o=>o.id===id).text+' ');
            for(const [label,offset] of [['上移',-1],['下移',1]]){
              const b=element('button',label);b.type='button';const dest=i+offset;b.disabled=!editable||dest<0||dest>=choice.length;
              b.onclick=()=>{const next=[...choice];[next[i],next[dest]]=[next[dest],next[i]];set(next);draw();group.parentElement?.focus();container.querySelectorAll('[data-order]')[dest]?.focus();};
              row.append(b);
            }
            row.tabIndex=-1;row.dataset.order='';group.append(row);
          });
        }else for(const o of options){
          const label=element('label'),input=element('input');input.type=q.type==='multiple'?'checkbox':'radio';input.name='quiz-'+config.id;
          input.checked=q.type==='multiple'?values().includes(o.id):choice===o.id;input.disabled=!editable;
          input.onchange=()=>set(q.type==='multiple'?(input.checked?[...values(),o.id]:values().filter(v=>v!==o.id)):o.id);
          label.append(input,document.createTextNode(' '+o.text));group.append(label);
        }
        if(editable){
          submit=button('提交',()=>{
            if(!Object.hasOwn(first,q.id))Object.defineProperty(first,q.id,{value:{answer:choice,correct:correct()},enumerable:true,configurable:true});
            update({choice,phase:correct()?'answer':'hint'});draw(true);
          });submit.disabled=!valid();
        }else if(progress.phase==='hint'){
          feedback.textContent=q.hint??options.find(o=>o.id===choice)?.hint;
          button('再试一次',()=>{update({choice:null,phase:'choose'});draw(true);});
          button('查看解析',()=>{update({phase:'answer'});draw(true);});
        }else{
          const solution=q.type==='number'?q.correct+' '+q.unit:(Array.isArray(q.correct)?q.correct:[q.correct]).map(id=>options.find(o=>o.id===id).text).join(q.type==='order'?' → ':'、');
          feedback.textContent=(last?'已完成。':'')+'正确答案是「'+solution+'」。'+q.explanation;
          if(last){
            const recorded=Object.values(first).filter(Boolean);
            feedback.append(document.createTextNode(' 首答正确 '+recorded.filter(x=>x.correct).length+'/'+recorded.length+'，未记录 '+(questions.length-recorded.length)+' 题。'));
            const wrong=questions.map((_,i)=>i).filter(i=>Object.hasOwn(first,questions[i].id)&&first[questions[i].id]?.correct===false);
            if(wrong.length)button('只练错题',()=>{update({index:wrong[0],review:wrong,choice:null,phase:'choose'});draw(true);});
          }
          button(last?'重新开始':'下一题',()=>{
            if(last){for(const key of Object.keys(first))delete first[key];}
            update({index:last?0:sequence[position+1],review:last?undefined:progress.review,phase:'choose',choice:null});draw(true);
          });
        }
        container.replaceChildren(group, feedback, actions);
        if (focus) {
          const target = progress.phase === 'choose' ? title : feedback;
          target.tabIndex = -1;
          target.focus();
        }
      }
      draw();
    } catch (error) {
      const message = '练习配置错误：' + error.message;
      if (container instanceof HTMLElement) container.replaceChildren(element('p', message));
      report(message);
    }
  }
  return Object.freeze({ mount });
}

(() => {
  'use strict';
  let initialized = false;
  addEventListener('message', (event) => {
    if (
      initialized ||
      event.source !== parent ||
      event.data?.type !== 'more-genui-init' ||
      event.ports.length !== 1
    )
      return;
    initialized = true;
    const port = event.ports[0],
      config = event.data;
    const send = (type, value) => port.postMessage({ type, value });
    let state = config.state || {},
      failed = false;
    const report = (message) => {
      failed = true;
      send('error', String(message).slice(0, 2000));
    };
    const theme = (value) => {
      document.documentElement.dataset.theme = value === 'dark' ? 'dark' : 'light';
    };
    const quizKey = '__moreGenuiQuizV1';
    function commit(value) {
      if (!value || Array.isArray(value) || typeof value !== 'object')
        throw Error('State must be a JSON object');
      const raw = JSON.stringify(value);
      if (new TextEncoder().encode(raw).length > 65536) throw Error('State exceeds 64 KiB');
      state = JSON.parse(raw);
      send('state', state);
    }
    const experiment=createExperimentAPI(send);
    const stepsKey='__moreGenuiSteps';
    const stepper=createStepperAPI(id=>state[stepsKey]?.[id],(id,v)=>commit({...state,[stepsKey]:{...state[stepsKey],[id]:v}}),report);
    const quiz = createQuizAPI(
      (id) => state[quizKey]?.[id],
      (id, value) => commit({ ...state, [quizKey]: { ...state[quizKey], [id]: value } }),
      report,
    );
    Object.defineProperty(window, 'genui', {
      value: Object.freeze({
        quiz,stepper,experiment:experiment.api,capabilities:Object.freeze({quiz:2,stepper:1,experiment:1,state:1,export:1}),
        getState() {
          const result = structuredClone(state);
          delete result[quizKey];delete result[stepsKey];
          return result;
        },
        setState(value) {
          if (!value || Array.isArray(value) || typeof value !== 'object')
            throw Error('State must be a JSON object');
          const next = { ...value };
          delete next[quizKey];delete next[stepsKey];if(state[stepsKey])next[stepsKey]=state[stepsKey];
          if (state[quizKey]) next[quizKey] = state[quizKey];
          commit(next);
        },
      }),
      writable: false,
      configurable: false,
    });
    addEventListener('error', (e) => report(e.message));
    addEventListener('unhandledrejection', (e) => report(e.reason));
    port.onmessage = (e) => {
      if(e.data?.type==='png'){const id=e.data.id;experiment.png().then(blob=>send('png',{id,blob}),e=>send('png',{id,error:String(e.message)}));}
      if (e.data?.type === 'theme') theme(e.data.value);
    };
    const requirement=/^\s*<!--\s*more-genui-requires:\s*([^]*?)-->/.exec(config.html);
    if(requirement){
      try{
        const needs=JSON.parse(requirement[1]);
        if(!needs||typeof needs!=='object'||Array.isArray(needs))throw Error('能力声明须为对象');
        for(const [name,min] of Object.entries(needs)){
          if(!Number.isSafeInteger(min)||min<1||!Object.hasOwn(genui.capabilities,name)||genui.capabilities[name]<min)
            throw Error('此应用需要 '+name+'@'+min+'，请更新 More GenUI');
        }
      }catch(e){report(e.message);return;}
    }
    const doc = new DOMParser().parseFromString(config.html, 'text/html');
    const scripts = [...doc.querySelectorAll('script')].map((s) => ({
      code: s.textContent,
      external: s.hasAttribute('src'),
      type: s.type,
    }));
    doc
      .querySelectorAll('script,iframe,frame,object,embed,base,meta,link')
      .forEach((n) => n.remove());
    for (const element of doc.querySelectorAll('*'))
      for (const attribute of [...element.attributes]) {
        if (
          ['href', 'srcset', 'action', 'formaction', 'target', 'ping', 'download'].includes(
            attribute.name,
          )
        )
          element.removeAttribute(attribute.name);
        if (attribute.name === 'src' && !attribute.value.startsWith('data:'))
          element.removeAttribute('src');
      }
    const style = document.createElement('style');
    style.textContent =
      ':root{--bg:#fff;--fg:#202124;--accent:#526de0;color-scheme:light}html[data-theme=dark]{--bg:#202124;--fg:#eee;color-scheme:dark}body{margin:16px;font:15px/1.5 system-ui;background:var(--bg);color:var(--fg)}input,select,button{font:inherit}svg,canvas{max-width:100%}*{box-sizing:border-box}';
    style.textContent +=
      ':root{--muted:#687078;--surface:#f5f6f7;--border:#e4e7eb;--accent:#3569c8;--chart-1:#3569c8;--chart-2:#218477;--chart-3:#b57927}html[data-theme=dark]{--muted:#a4aab2;--surface:#292c30;--border:#41454b;--accent:#8cb4ff;--chart-1:#8cb4ff;--chart-2:#65c7b3;--chart-3:#e5b26b}body{margin:0;padding:16px;font:14px/1.6 system-ui}h1,h2,h3{font-size:1rem;font-weight:600;margin:0 0 10px}p{margin:6px 0}button,select,input[type=number]{border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--fg);padding:5px 9px}input{accent-color:var(--accent)}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}label{display:block;color:var(--muted)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.muted,figcaption{color:var(--muted);font-size:12px}.panel{background:var(--surface);padding:12px;border-radius:8px}output{font-variant-numeric:tabular-nums}';
    document.head.append(style, ...doc.head.childNodes);
    document.body.replaceChildren(...doc.body.childNodes);
    for (const a of doc.body.attributes) document.body.setAttribute(a.name, a.value);
    theme(config.theme);
    addEventListener(
      'click',
      (e) => {
        if (e.target instanceof Element && e.target.closest('a')) e.preventDefault();
      },
      true,
    );
    addEventListener('submit', (e) => e.preventDefault(), true);
    const submitLocal = (form, submitter = null) => {
      if (!form.checkValidity()) {
        form.reportValidity();

    };
    addEventListener(
      'click',
      (e) => {
        const button =
          e.target instanceof Element ? e.target.closest('button,input[type=submit]') : null;
        if (button && button.type === 'submit' && button.form && !button.disabled) {
          e.preventDefault();
          queueMicrotask(() => submitLocal(button.form, button));
        }
      },
      true,
    );
    addEventListener(
      'keydown',
      (e) => {
        const input = e.target;
        if (e.key === 'Enter' && input instanceof HTMLInputElement && input.form) {
          e.preventDefault();
          submitLocal(input.form);
        }

      true,

    content.id = 'genui-content';
    content.append(...document.body.childNodes);
    document.body.append(content);
    let lastHeight = 0;
    new ResizeObserver(() => {
      const height = Math.max(24, content.getBoundingClientRect().height + 32);
      if (height !== lastHeight) {
        lastHeight = height;
        send('resize', height);
      }
    }).observe(content);
    for (const script of scripts) {
      if (script.external) {
        report('External scripts are not supported');
        continue;
      }
      if (
        script.type &&
        script.type !== 'text/javascript' &&
        script.type !== 'application/javascript'
      ) {
        report('Only classic JavaScript is supported');
        continue;
      }
      const element = document.createElement('script');
      element.textContent = script.code;
      document.body.append(element);
    }
    document.dispatchEvent(new Event('DOMContentLoaded'));
    if (!failed) send('ready', true);
  });
})();
